group 'com.almoullim.background_location'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdk 36
    namespace = 'com.almoullim.background_location'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk 21
    }

    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.material:material:1.12.0'
}

// Kotlin is compiled by AGP's built-in Kotlin (AGP 9+), or by KGP applied by the
// Flutter Gradle plugin on older setups; align its JVM target with the Java one.
def kotlinExt = project.extensions.findByName('kotlin')
if (kotlinExt != null) {
    kotlinExt.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}
